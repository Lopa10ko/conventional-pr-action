name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Ensure dist is up to date
        run: |
          git diff --exit-code dist/ || (
            echo "dist/ is out of date. Run npm run build and commit dist/."
            exit 1
          )
